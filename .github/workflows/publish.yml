name: 承認されたものを投稿する

# GitHubの定期実行は数時間ずれることがあり、時刻の指定では19時に投稿できない。
# そこで30分おきに起動し、毎回「いまが19時以降か」を自分で判断する方式にしている。
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 投稿してよい時間か確認する
        id: window
        run: |
          hour=$(TZ=Asia/Tokyo date +%H)
          now=$(TZ=Asia/Tokyo date '+%m-%d %H:%M')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行なので、時間に関係なく進みます（現在 $now）"
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -ge 19 ]; then
            echo "現在 $now。19時を過ぎているので投稿できます。"
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "現在 $now。19時前なので何もしません。"
            echo "ok=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.ok == 'yes'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.window.outputs.ok == 'yes'
        with:
          node-version: "20"

      - name: 承認済みの下書きを探す
        id: find
        if: steps.window.outputs.ok == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --label approved --state open --limit 1 --json number --jq '.[0].number')
          if [ -z "$number" ] || [ "$number" = "null" ]; then
            echo "承認されたものがありません。今日は投稿しません。"
            echo "found=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title=$(gh issue view "$number" --json title --jq .title)
          date=$(echo "$title" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [ -z "$date" ]; then
            echo "Issueのタイトルから日付を読み取れませんでした: $title"
            echo "found=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "found=yes"      >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "date=$date"     >> "$GITHUB_OUTPUT"
          echo "承認済み: Issue #$number（$date）"

      - name: 投稿する
        if: steps.find.outputs.found == 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/publish.mjs content/posts/${{ steps.find.outputs.date }}.json

      - name: 結果を報告してIssueを閉じる
        if: steps.find.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          link=$(cat permalink.txt 2>/dev/null || echo "")
          echo "✅ 投稿しました！" > comment.md
          echo "" >> comment.md
          echo "$link" >> comment.md
          gh issue comment ${{ steps.find.outputs.number }} --body-file comment.md
          gh issue close ${{ steps.find.outputs.number }}

      - name: ネタ帳に [済] を付ける
        if: steps.find.outputs.found == 'yes'
        run: |
          node scripts/mark-topic-done.mjs content/posts/${{ steps.find.outputs.date }}.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/topics.md
          git diff --staged --quiet || git commit -m "投稿済み ${{ steps.find.outputs.date }}"
          git push
