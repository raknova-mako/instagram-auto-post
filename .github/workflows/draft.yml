name: 下書きを作る

on:
  schedule:
    # 毎時0分はGitHub側の負荷が高く、実行が破棄されることがあるため0分を避ける。
    - cron: "23 22 * * *"   # 07:23（日本時間）本番
    - cron: "23 0 * * *"    # 09:23（日本時間）予備。すでに作成済みなら何もしない
  workflow_dispatch:
  issues:
    types: [labeled]        # retry ラベルが付いたら作り直す

permissions:
  contents: write
  issues: write

jobs:
  draft:
    if: github.event_name != 'issues' || github.event.label.name == 'retry'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 今日の日付
        id: today
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"

      - name: すでに今日の下書きがあるか確認する
        id: guard
        run: |
          # 定期実行のときだけ二重作成を防ぐ（retry や手動実行では作り直したい）
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "content/posts/${{ steps.today.outputs.date }}.json" ]; then
            echo "今日の下書きはすでに作成済みです。何もしません。"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'no'
        with:
          node-version: "20"
          cache: npm

      - name: 必要なものを入れる
        if: steps.guard.outputs.skip == 'no'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 作り直しの場合は前のIssueを閉じる
        if: steps.guard.outputs.skip == 'no' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "作り直します。新しい下書きを作成中です。"

      - name: AIに原稿を書かせる
        if: steps.guard.outputs.skip == 'no'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate.mjs

      - name: 画像を作る
        if: steps.guard.outputs.skip == 'no'
        run: node scripts/render.mjs content/posts/${{ steps.today.outputs.date }}.json published/${{ steps.today.outputs.date }}

      - name: 画像の公開URLを書き込む
        if: steps.guard.outputs.skip == 'no'
        run: |
          node scripts/set-image-urls.mjs \
            content/posts/${{ steps.today.outputs.date }}.json \
            published/${{ steps.today.outputs.date }} \
            https://raw.githubusercontent.com/${{ github.repository }}/main

      - name: GitHubに保存する
        if: steps.guard.outputs.skip == 'no'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published content/posts
          git commit -m "下書き ${{ steps.today.outputs.date }}"
          git push

      - name: 承認用のIssueを作る
        if: steps.guard.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create approved --color 0E8A16 --description "この内容で投稿する" --force
          gh label create retry    --color D93F0B --description "作り直す"           --force
          gh label create 承認まち  --color FBCA04 --description "確認をお待ちしています" --force

          node scripts/make-issue.mjs content/posts/${{ steps.today.outputs.date }}.json > issue-body.md
          gh issue create \
            --title "【承認おねがいします】${{ steps.today.outputs.date }} の投稿" \
            --body-file issue-body.md \
            --label 承認まち

      - name: 失敗したら知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "今朝の下書きを作れませんでした。" > fail.md
          echo "" >> fail.md
          echo "原因の詳細はこちら:" >> fail.md
          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> fail.md
          echo "" >> fail.md
          echo "AIの混雑が原因なら、Actions画面から手動でもう一度実行すれば作れます。" >> fail.md
          gh issue create --title "⚠️ 下書きの作成に失敗しました" --body-file fail.md
